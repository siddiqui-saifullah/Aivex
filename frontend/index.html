<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons: Google search shows the favicon on a white background, so the logo has a solid fill -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/aivex.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Aivex – Browser Based IDE with AI</title>
    <meta
      name="description"
      content="Aivex is a browser-based IDE with built-in AI that allows you to run Node.js servers without installing anything locally."
    />

    <!-- Open Graph (For WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aivex.in/" />
    <meta property="og:title" content="Aivex – Browser Based IDE with AI" />
    <meta
      property="og:description"
      content="Run Node.js projects directly in your browser with AI assistance. No installation required."
    />
    <meta property="og:image" content="https://aivex.in/aivex.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aivex – Browser Based IDE with AI" />
    <meta
      name="twitter:description"
      content="Run Node.js projects in your browser with AI assistance."
    />
    <meta name="twitter:image" content="https://aivex.in/aivex.png" />

    <!-- Site name and logo for Google search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "WebSite", "name": "Aivex", "url": "https://aivex.in/" },
          { "@type": "Organization", "name": "Aivex", "url": "https://aivex.in/", "logo": "https://aivex.in/icon-512.png" }
        ]
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
